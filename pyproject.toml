[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolosip"
dynamic = ["version"]
description = "Facts-only FAQ assistant for HDFC Mutual Fund schemes. Facts-only. No investment advice."
readme = "README.md"
requires-python = ">=3.10"
# The core uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
# Optional LLM rephrasing via Groq (Phase 7). Needs GROQ_API_KEY in .env.
llm = ["groq"]

[tool.setuptools]
packages = ["bolosip"]

[tool.setuptools.dynamic]
version = { attr = "bolosip.__version__" }
