[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolosip"
dynamic = ["version"]
description = "Facts-only FAQ assistant for HDFC Mutual Fund schemes. Facts-only. No investment advice."
readme = "README.md"
requires-python = ">=3.10"
# The core uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
# Better retrieval (Phase 3): local nomic embeddings via fastembed (ONNX, CPU) and a
# local ChromaDB vector store. These packages have no Python 3.15 builds yet, so the
# extra installs nothing there and BoloSIP falls back to BM25 (architecture §8).
embed = [
    "fastembed>=0.9,<1; python_version < '3.15'",
    "numpy>=1.26; python_version < '3.15'",
    "chromadb>=1.0,<2; python_version < '3.15'",
]
# Optional LLM rephrasing via Groq (Phase 7). Needs GROQ_API_KEY in .env.
llm = ["groq"]
# Browser tests of the chat page (tests/test_ui_browser.py). After installing, run
# `python -m playwright install chromium` once.
ui-tests = ["playwright>=1.49,<2"]

[tool.setuptools]
packages = ["bolosip"]

[tool.setuptools.dynamic]
version = { attr = "bolosip.__version__" }
