name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependencies to install: the core is standard library only, and the
      # default test run is offline with no Groq key (Doc/Implementation-plan.md §6).
      - name: Unit tests
        run: python -m unittest discover tests -v

      - name: Evaluation gates
        run: python -m eval.run --all --no-write
