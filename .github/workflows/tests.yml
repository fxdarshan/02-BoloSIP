name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependencies to install: the core is standard library only, and the
      # default test run is offline with no Groq key (Doc/Implementation-plan.md §6).
      # Retrieval uses the BM25 fallback here; real-model tests are skipped.
      - name: Unit tests
        run: python -m unittest discover tests -v

      - name: Evaluation gates
        run: python -m eval.run --all --no-write

  embed:
    # Phase 3: the dense path (local nomic embeddings + ChromaDB) with the real model.
    name: Embeddings + ChromaDB (Python 3.12, ubuntu)
    runs-on: ubuntu-latest
    env:
      BOLOSIP_RETRIEVER: embed          # fail instead of silently falling back to BM25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the embed extra
        run: pip install -e ".[embed]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-nomic-embed-text-v1.5-fastembed-0.9

      # Downloads the model on a cache miss (about 550 MB), then checks the committed
      # vectors still match corpus.json and builds the local Chroma collection.
      - name: Build embeddings and ChromaDB
        run: python ingest.py --embed-only

      - name: Committed vectors are up to date
        run: git diff --exit-code -- data/embeddings.json

      - name: Unit tests (real model)
        run: python -m unittest discover tests -v

      - name: Evaluation gates (dense)
        run: python -m eval.run --all --no-write

  ui:
    # The chat page in a real browser (Playwright + headless Chromium): examples, chips,
    # typing suggestions with the keyboard, fallback, XSS, phone drawer, overflow scan.
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    env:
      BOLOSIP_UI_TESTS: "1"             # fail instead of skipping if the browser is missing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright and Chromium
        run: |
          pip install -e ".[ui-tests]"
          python -m playwright install --with-deps chromium

      - name: Browser tests
        run: python -m unittest tests.test_ui_browser -v

  docker:
    # The container Railway runs (Doc/deployment-plan.md §4): build the image, start it the
    # way Railway does (PORT, a /data volume, proxy settings), smoke-test it over HTTP,
    # check Railway's healthcheck Host, then stop it with SIGTERM and expect a clean exit.
    name: Docker image (deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the image
        run: docker build -t bolosip:ci .

      - name: Start it like Railway
        run: |
          docker volume create bolosip-data
          docker run -d --name bolosip -p 7123:7123 -v bolosip-data:/data \
            -e PORT=7123 -e BOLOSIP_TRUST_PROXY=1 -e BOLOSIP_PUBLIC_HOSTS=bolosip.example \
            -e BOLOSIP_RETENTION_DAYS=30 bolosip:ci
          for i in $(seq 1 120); do
            if curl -fsS -H "Host: healthcheck.railway.app" http://127.0.0.1:7123/api/health > /dev/null 2>&1; then
              echo "healthy after ${i} s"; exit 0
            fi
            sleep 1
          done
          docker logs bolosip; exit 1

      - name: Smoke test
        run: python scripts/smoke_remote.py http://localhost:7123 --max-age 30

      - name: Railway's healthcheck Host works only for /api/health
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: healthcheck.railway.app' http://127.0.0.1:7123/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: healthcheck.railway.app' http://127.0.0.1:7123/api/threads)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: bolosip.example' -H 'X-Forwarded-Proto: https' http://127.0.0.1:7123/api/health)" = 200

      - name: Runs as a non-root user
        run: test "$(docker exec bolosip stat -c %U /proc/1)" = app

      - name: Stops cleanly on SIGTERM
        run: |
          docker stop --time 15 bolosip
          test "$(docker inspect -f '{{.State.ExitCode}}' bolosip)" = 0
          docker logs bolosip 2>&1 | tail -5
          docker logs bolosip 2>&1 | grep -q "BoloSIP stopped."

      - name: The database and ChromaDB live on the volume and survive a restart
        run: |
          docker start bolosip
          for i in $(seq 1 120); do curl -fsS http://localhost:7123/api/health > /dev/null 2>&1 && break; sleep 1; done
          docker exec bolosip test -f /data/bolosip.sqlite3
          docker exec bolosip test -d /data/chroma

      - name: Logs on failure
        if: failure()
        run: docker logs bolosip || true
