<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>BoloSIP</title>
<meta name="description" content="Facts-only answers about 27 HDFC Mutual Fund schemes, each with its source. No investment advice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230071e3'/%3E%3Cpath d='M9 21V18M14 21V15M19 21V12M24 21V9' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint (no flash). Storage may be blocked: ignore.
  try { var t = localStorage.getItem("bolosip.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ---------------------------------------------------------------------------
   BoloSIP web UI. One file: no external scripts, fonts or trackers.
   Look: Apple-style. System San Francisco font (Segoe UI Variable on Windows),
   Apple system grays and colours, frosted translucent bars, soft shadows instead of
   borders, continuous large radii. Every text colour meets WCAG AA in both themes.
   --------------------------------------------------------------------------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", system-ui, Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px;
  --header-h: 60px;
  --sidebar-w: 280px;
  --col: 760px;
  --ease: cubic-bezier(.25,.1,.25,1);
  --spring: cubic-bezier(.34,1.3,.64,1);
}
[data-theme="dark"] {
  --bg: #000000;
  --panel: #0d0d0f;
  --card: #1c1c1e;
  --card-hi: #2c2c2e;
  --material: rgba(28, 28, 30, .72);           /* frosted bars */
  --glow-a: rgba(64, 156, 255, .14);
  --glow-b: rgba(191, 90, 242, .10);
  --hero: linear-gradient(92deg, #409cff 0%, #7d7aff 45%, #da8fff 100%);
  --value-text: #69b4ff;
  --user-bubble: #0071e3; --on-user: #ffffff;
  --btn: #0071e3; --on-btn: #ffffff;
  --line: rgba(235, 235, 245, .10);
  --line-strong: rgba(235, 235, 245, .17);
  --text: #f5f5f7;
  --muted: #aeaeb2;
  --faint: #98989d;
  --accent: #409cff;
  --accent-hi: #69b4ff;
  --on-accent: #00172e;
  --focus: #409cff;
  --shadow: 0 0 0 .5px rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.45);
  --shadow-sm: 0 0 0 .5px rgba(255,255,255,.06) inset, 0 2px 8px rgba(0,0,0,.4);
  --k-answer: #32d74b;   --k-answer-bg: rgba(50,215,75,.14);
  --k-refusal: #64d2ff;  --k-refusal-bg: rgba(100,210,255,.14);
  --k-perf: #da8fff;     --k-perf-bg: rgba(218,143,255,.14);
  --k-privacy: #ff6961;  --k-privacy-bg: rgba(255,105,97,.14);
  --k-clarify: #ffd60a;  --k-clarify-bg: rgba(255,214,10,.13);
  --k-notfound: #aeaeb2; --k-notfound-bg: rgba(174,174,178,.12);
  --value-bg: rgba(64,156,255,.14);
  --danger: #ff6961; --danger-bg: #c4251c; --on-danger: #ffffff;
  --scrim: rgba(0, 0, 0, .55);
}
[data-theme="light"] {
  --bg: #f5f5f7;
  --panel: #f2f2f7;
  --card: #ffffff;
  --card-hi: #ebebf0;
  --material: rgba(250, 250, 252, .78);
  --glow-a: rgba(0, 113, 227, .07);
  --glow-b: rgba(137, 68, 171, .05);
  --hero: linear-gradient(92deg, #0066cc 0%, #5e5ce6 50%, #8944ab 100%);
  --value-text: #0058b0;
  --user-bubble: #0071e3; --on-user: #ffffff;
  --btn: #0071e3; --on-btn: #ffffff;
  --line: rgba(60, 60, 67, .12);
  --line-strong: rgba(60, 60, 67, .18);
  --text: #1d1d1f;
  --muted: #3a3a3c;
  --faint: #636366;
  --accent: #0066cc;
  --accent-hi: #0071e3;
  --on-accent: #ffffff;
  --focus: #0071e3;
  --shadow: 0 0 0 .5px rgba(0,0,0,.05), 0 8px 28px rgba(0,0,0,.07);
  --shadow-sm: 0 0 0 .5px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.06);
  --k-answer: #1d7a33;   --k-answer-bg: rgba(29,122,51,.10);
  --k-refusal: #0066cc;  --k-refusal-bg: rgba(0,102,204,.09);
  --k-perf: #8944ab;     --k-perf-bg: rgba(137,68,171,.09);
  --k-privacy: #c4251c;  --k-privacy-bg: rgba(196,37,28,.08);
  --k-clarify: #9a5500;  --k-clarify-bg: rgba(255,159,10,.14);
  --k-notfound: #636366; --k-notfound-bg: rgba(99,99,102,.10);
  --value-bg: rgba(0,102,204,.09);
  --danger: #c4251c; --danger-bg: #c4251c; --on-danger: #ffffff;
  --scrim: rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.55 var(--font); letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
svg.i { width: 1em; height: 1em; flex: none; display: block; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 70%, transparent); outline-offset: 2px; border-radius: var(--r-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---- App frame ------------------------------------------------------------ */
.app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr; }

.header {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  min-height: var(--header-h); padding: 0 18px;
  background: var(--material);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; filter: drop-shadow(0 2px 6px rgba(0,113,227,.35)); }
.brand-name { font: 650 19px/1 var(--display); letter-spacing: -.02em; }
.brand-name b { font-weight: 650; color: var(--accent); }
.disclaimer {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px; border-radius: 999px;
  background: var(--card-hi); font-size: 13px; font-weight: 550; white-space: nowrap; color: var(--muted);
}
.disclaimer svg { font-size: 15px; color: var(--k-answer); }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px;
  border-radius: 999px; border: 0; background: var(--card-hi);
  font-size: 18px; color: var(--muted); transition: background .2s, color .2s, transform .2s var(--spring);
}
.icon-btn:hover { color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.menu-btn { display: none; }

.body { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 0; }

/* ---- Sidebar ---------------------------------------------------------------- */
.sidebar {
  display: flex; flex-direction: column; gap: 12px; min-height: 0;
  padding: 16px 12px; background: var(--panel); border-right: 1px solid var(--line);
}
.new-chat {
  display: flex; align-items: center; gap: 9px;
  height: 40px; padding: 0 14px; border: 0; border-radius: 999px;
  background: var(--card-hi); color: var(--text);
  font-weight: 590; font-size: 14.5px; transition: background .2s, transform .2s var(--spring);
}
.new-chat svg { font-size: 17px; color: var(--accent); }
.new-chat:hover { background: color-mix(in srgb, var(--card-hi) 70%, var(--text) 8%); }
.new-chat:active { transform: scale(.98); }
.side-label { display: flex; justify-content: space-between; padding: 6px 10px 0; font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--faint); }
.threads { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.thread-row { position: relative; }
.thread-btn {
  width: 100%; display: flex; align-items: center; gap: 11px; text-align: left;
  padding: 9px 42px 9px 10px; border-radius: var(--r-sm); border: 0; background: transparent;
  transition: background .15s;
}
.thread-btn:hover { background: color-mix(in srgb, var(--card-hi) 60%, transparent); }
.thread[aria-current="true"] .thread-btn { background: var(--card-hi); }
.thread-ico { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--card); color: var(--faint); font-size: 15px; box-shadow: var(--shadow-sm); }
.thread[aria-current="true"] .thread-ico { background: var(--btn); color: var(--on-btn); }
.thread-text { min-width: 0; }
.thread-title { display: block; font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread-time { display: block; font-size: 12px; color: var(--faint); }
.thread-del {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 999px;
  background: transparent; color: var(--faint); font-size: 16px; opacity: 0; transition: opacity .15s, background .15s, color .15s;
}
.thread-row:hover .thread-del, .thread-row:focus-within .thread-del, .thread[aria-current="true"] .thread-del { opacity: 1; }
.thread-del:hover { background: var(--k-privacy-bg); color: var(--danger); }
.confirm {
  margin: 4px 4px 6px; padding: 14px; border-radius: var(--r-md);
  background: var(--card); box-shadow: var(--shadow);
  display: grid; gap: 12px;
}
.confirm p { margin: 0; font-size: 14px; }
.confirm small { color: var(--faint); }
.confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn { height: 32px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--card-hi); font-size: 13.5px; font-weight: 590; }
.btn:hover { filter: brightness(1.08); }
.btn-danger { background: var(--danger-bg); color: var(--on-danger); }
.empty-threads { padding: 22px 8px; text-align: center; color: var(--faint); font-size: 13.5px; }
.empty-threads svg { font-size: 28px; margin: 0 auto 8px; opacity: .6; }
.side-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); line-height: 1.5; }
.side-foot strong { color: var(--muted); font-weight: 600; }

/* ---- Chat column ------------------------------------------------------------- */
.chat {
  display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0;
  background:
    radial-gradient(800px 360px at 50% -120px, var(--glow-a), transparent 70%),
    radial-gradient(600px 400px at 100% 110%, var(--glow-b), transparent 70%);
}
.scroll { overflow-y: auto; scroll-behavior: smooth; }
.messages { max-width: var(--col); margin: 0 auto; padding: 28px 22px 24px; display: flex; flex-direction: column; gap: 16px; }

/* Welcome */
.welcome { text-align: center; padding: 8vh 0 8px; animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin: 0 0 20px; padding: 5px 13px 5px 10px;
  border-radius: 999px; background: var(--card); box-shadow: var(--shadow-sm);
  font-size: 13px; font-weight: 550; color: var(--muted);
}
.eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--k-answer);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--k-answer) 25%, transparent); }
.welcome h1 {
  margin: 0 0 14px; font: 700 clamp(32px, 4.4vw, 52px)/1.06 var(--display); letter-spacing: -.035em;
}
.welcome h1 em {
  display: block; font-style: normal; color: var(--accent); padding-bottom: .12em; margin-bottom: -.12em;
  background: var(--hero); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.welcome p { margin: 0 auto; max-width: 540px; color: var(--muted); font-size: 17px; line-height: 1.5; letter-spacing: -.015em; }
.topics { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 26px auto 0; max-width: 620px; }
.topic {
  padding: 7px 14px; border-radius: 999px; border: 0; background: var(--card-hi);
  font-size: 14px; font-weight: 550; color: var(--text); transition: background .2s, color .2s, transform .2s var(--spring);
}
.topic:hover { background: var(--btn); color: var(--on-btn); }
.topic:active { transform: scale(.96); }
.examples-label { margin: 38px 0 14px; font-size: 13px; font-weight: 600; color: var(--faint); }
.examples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; text-align: left; }
.example {
  display: flex; flex-direction: column; gap: 14px; padding: 18px; min-height: 150px; text-align: left;
  border-radius: var(--r-lg); border: 0; background: var(--card); box-shadow: var(--shadow);
  transition: transform .35s var(--spring), box-shadow .3s;
}
.example:hover { transform: translateY(-4px) scale(1.01); box-shadow: var(--shadow), 0 18px 40px rgba(0,0,0,.18); }
.example-top { display: flex; justify-content: space-between; align-items: center; }
.tile {
  display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; font-size: 22px;
  color: #ffffff; box-shadow: 0 4px 12px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
}
.t-green { background: linear-gradient(160deg, #34c759, #248a3d); }
.t-amber { background: linear-gradient(160deg, #ff9f0a, #c93400); }
.t-blue  { background: linear-gradient(160deg, #0a84ff, #0040dd); }
.example-tag.t-green { color: var(--k-answer); }
.example-tag.t-amber { color: var(--k-clarify); }
.example-tag.t-blue  { color: var(--accent); }
.example-arrow { color: var(--faint); font-size: 17px; transition: color .2s, transform .3s var(--spring); }
.example:hover .example-arrow { color: var(--accent); transform: translate(2px, -2px); }
.example-tag { font-size: 12px; font-weight: 650; letter-spacing: .02em; }
.example-q { font-size: 16px; font-weight: 590; line-height: 1.35; margin-top: 3px; letter-spacing: -.015em; }
.trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; margin: 30px 0 0; padding: 0; list-style: none; }
.trust li { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--faint); }
.trust svg { color: var(--k-answer); font-size: 15px; }

/* Messages */
.msg-user {
  align-self: flex-end; max-width: 76%; padding: 9px 15px; border-radius: 20px 20px 6px 20px;
  background: var(--user-bubble); color: var(--on-user); white-space: pre-wrap; overflow-wrap: anywhere;
  box-shadow: 0 2px 10px rgba(0,113,227,.25); animation: pop .35s var(--spring) both;
}
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.96); } }
.reply {
  --k: var(--k-answer); --k-bg: var(--k-answer-bg);
  display: grid; grid-template-columns: 1fr; gap: 10px; max-width: 100%;
  padding: 16px 20px 14px; border-radius: var(--r-lg);
  background: var(--card); box-shadow: var(--shadow);
  position: relative; overflow: hidden; animation: rise .4s var(--ease) both;
}
.reply[data-kind="refusal"]     { --k: var(--k-refusal);  --k-bg: var(--k-refusal-bg); }
.reply[data-kind="performance"] { --k: var(--k-perf);     --k-bg: var(--k-perf-bg); }
.reply[data-kind="privacy"]     { --k: var(--k-privacy);  --k-bg: var(--k-privacy-bg); }
.reply[data-kind="clarify"]     { --k: var(--k-clarify);  --k-bg: var(--k-clarify-bg); }
.reply[data-kind="not_found"]   { --k: var(--k-notfound); --k-bg: var(--k-notfound-bg); }
.reply-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.reply-ico { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: var(--k-bg); color: var(--k); font-size: 14px; flex: none; }
.reply-body { min-width: 0; }
.kind-label { display: inline-block; margin: 0; font-size: 13px; font-weight: 600; color: var(--k); letter-spacing: -.005em; }
.reply-body > .kind-label { display: none; }
.reply-text { margin: 0; font-size: 17px; line-height: 1.55; letter-spacing: -.018em; overflow-wrap: anywhere; }
.value { color: var(--value-text); font-weight: 650; white-space: nowrap; }
.reply[data-kind="privacy"] .value, .reply[data-kind="refusal"] .value { color: inherit; font-weight: inherit; }
.reply-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
.source {
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%; min-width: 0;
  text-decoration: none; font-size: 14px; font-weight: 550; color: var(--accent);
}
.source:hover span:first-of-type { text-decoration: underline; text-underline-offset: 3px; }
.source span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source svg { font-size: 14px; }
.source .domain { flex: none; padding: 1px 8px; border-radius: 999px; background: var(--card-hi); color: var(--muted); font-size: 12px; font-weight: 550; }
.footer { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12.5px; color: var(--faint); }
.footer svg { font-size: 13px; }
.choices { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.choice {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
  padding: 11px 14px; border-radius: var(--r-md); border: 0; background: var(--card-hi);
  font-size: 15px; font-weight: 550; transition: background .2s, transform .2s var(--spring);
}
.choice:hover { background: color-mix(in srgb, var(--card-hi) 75%, var(--accent) 25%); }
.choice:active { transform: scale(.98); }
.choice svg { color: var(--accent); font-size: 16px; }
.choice:disabled { opacity: .5; cursor: default; }
.typing { display: inline-flex; gap: 5px; align-items: center; padding: 14px 18px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow-sm); align-self: flex-start; color: var(--muted); font-size: 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite both; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; transform: scale(.85); } 40% { opacity: 1; transform: none; } }

/* Composer */
.composer { padding: 10px 22px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
.composer-inner { max-width: var(--col); margin: 0 auto; }
.inputbox {
  display: flex; align-items: flex-end; gap: 10px; padding: 6px 6px 6px 18px;
  border-radius: var(--r-xl); background: var(--material); border: 1px solid var(--line-strong);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s;
}
.inputbox:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow: var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.inputbox textarea {
  flex: 1; min-height: 40px; max-height: 160px; resize: none; border: 0; outline: 0; background: transparent;
  padding: 9px 0; line-height: 1.45; font-size: 16px;
}
.inputbox textarea::placeholder { color: var(--faint); }
.count { align-self: center; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count.near { color: var(--k-clarify); }
.send {
  display: grid; place-items: center; width: 38px; height: 38px; margin: 1px; flex: none; border: 0; border-radius: 999px;
  background: var(--btn); color: var(--on-btn); font-size: 17px; transition: transform .2s var(--spring), background .2s;
}
.send:hover:not(:disabled) { transform: scale(1.06); }
.send:disabled { background: var(--card-hi); color: var(--faint); cursor: not-allowed; }
.hint { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--faint); text-align: center; }
.hint svg { color: var(--faint); font-size: 13px; }

/* Typing suggestions (combobox list above the input) */
.composer-inner { position: relative; }
.suggest {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 10px); z-index: 20;
  list-style: none; margin: 0; padding: 6px; max-height: min(320px, 45vh); overflow-y: auto;
  background: var(--material); border: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  border-radius: var(--r-lg); box-shadow: var(--shadow), 0 20px 50px rgba(0,0,0,.25);
}
.suggest[hidden] { display: none; }
.suggest-head { padding: 6px 10px 6px; font-size: 12px; font-weight: 600; color: var(--faint); }
.suggest li[role="option"] {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
  font-size: 15px; line-height: 1.35; cursor: pointer; overflow-wrap: anywhere;
}
.suggest li[role="option"] svg { flex: none; color: var(--faint); font-size: 15px; }
.suggest li[role="option"]:hover, .suggest li[aria-selected="true"] { background: var(--btn); color: var(--on-btn); }
.suggest li[role="option"]:hover svg, .suggest li[aria-selected="true"] svg { color: var(--on-btn); }
.suggest mark { background: none; color: inherit; font-weight: 700; }

/* Next-step chips under the latest reply */
.nextsteps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 2px 2px; }
.nextsteps-label { font-size: 13px; font-weight: 550; color: var(--faint); margin-right: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  padding: 7px 13px; border-radius: 999px; border: 0; background: var(--card-hi);
  font-size: 14px; font-weight: 550; color: var(--text); text-align: left; overflow-wrap: anywhere;
  transition: background .2s, color .2s, transform .2s var(--spring);
}
.chip svg { color: var(--accent); font-size: 14px; flex: none; }
.chip:hover { background: var(--btn); color: var(--on-btn); }
.chip:hover svg { color: var(--on-btn); }
.chip:active { transform: scale(.96); }
.capability-note { margin: 0 0 2px 2px; font-size: 14px; color: var(--muted); max-width: 640px; }

/* Toast */
.toast {
  position: fixed; left: 50%; top: calc(var(--header-h) + 12px); z-index: 60; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; max-width: min(92vw, 520px);
  padding: 11px 12px 11px 16px; border-radius: 999px;
  background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 14px;
}
.toast svg.lead { color: var(--k-clarify); font-size: 18px; }
.toast[hidden] { display: none; }
.toast .icon-btn { width: 28px; height: 28px; font-size: 14px; }

.scrim { display: none; }

/* ---- Narrow screens: same components, sidebar becomes a drawer ---------------- */
@media (max-width: 700px) {
  :root { --header-h: 100px; }
  .header { flex-wrap: wrap; gap: 8px 10px; padding: 10px 14px; }
  .menu-btn { display: inline-grid; }
  .brand { margin-right: auto; }
  .brand-mark { width: 28px; height: 28px; }
  /* May wrap: with a wide system font (DejaVu Sans on Linux, some Android fonts) one
     line is wider than a 320 px screen and pushed the whole page sideways (ISS-041). */
  .disclaimer { order: 3; width: 100%; min-width: 0; justify-content: center; text-align: center;
                white-space: normal; font-size: 13px; padding: 6px 12px; }
  .header > * { min-width: 0; }
  .body { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(86vw, 320px);
    transform: translateX(-102%); transition: transform .35s var(--ease);
    padding-top: calc(16px + env(safe-area-inset-top)); box-shadow: 0 0 60px rgba(0,0,0,.4);
  }
  .sidebar.open { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: var(--scrim);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .thread-del { opacity: 1; }
  .messages { padding: 18px 14px 18px; gap: 14px; }
  .welcome { padding-top: 3vh; }
  .welcome h1 { font-size: 34px; }
  .welcome p { font-size: 16px; }
  .topics { margin-top: 20px; gap: 6px; }
  .topic { font-size: 13.5px; padding: 6px 12px; }
  .examples-label { margin-top: 28px; }
  .examples { grid-template-columns: 1fr; gap: 10px; }
  .example { flex-direction: row; align-items: center; min-height: 0; padding: 12px 14px; gap: 14px; }
  .example-top { order: 0; }
  .example-arrow { display: none; }
  .example-q { font-size: 15px; margin: 0; }
  .trust { flex-direction: column; align-items: center; gap: 6px; margin-top: 22px; }
  .msg-user { max-width: 86%; }
  .reply { padding: 14px 15px 12px; }
  .reply-text { font-size: 16.5px; }
  .footer { margin-left: 0; }
  .choices { grid-template-columns: 1fr; }
  .composer { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .count { display: none; }
  .count.near { display: block; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

<body>
<div class="app">
  <header class="header">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open chats" aria-controls="sidebar" aria-expanded="false"></button>
    <a class="brand" href="/" aria-label="BoloSIP home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="bmGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: #3ea0ff"/><stop offset="1" style="stop-color: #0058d6"/>
        </linearGradient></defs>
        <rect x="1" y="1" width="38" height="34" rx="11" fill="url(#bmGrad)"/>
        <path d="M11 35l-2 5 8-5" fill="#0058d6"/>
        <path d="M12 25v-3M18 25v-6M24 25v-9M30 25v-12" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Bolo<b>SIP</b></span>
    </a>
    <div class="disclaimer" role="note"><span data-icon="shield"></span>Facts-only. No investment advice.</div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to light theme"></button>
  </header>

  <div class="body">
    <div class="scrim" id="scrim"></div>
    <nav class="sidebar" id="sidebar" aria-label="Chats">
      <button class="new-chat" id="newChat" type="button"><span data-icon="plus"></span>New chat</button>
      <div class="side-label"><span>Recent chats</span></div>
      <ul class="threads" id="threads"></ul>
      <div class="side-foot"><strong>Sources:</strong> the Groww pages of 27 HDFC Mutual Fund schemes and official HDFC MF, AMFI and SEBI pages. Each answer shows its own date.</div>
    </nav>

    <main class="chat">
      <div class="scroll" id="scroll">
        <section class="messages" id="messages" aria-live="polite" aria-label="Conversation"></section>
      </div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-inner">
          <ul class="suggest" id="suggestions" role="listbox" aria-label="Suggested questions" hidden></ul>
          <div class="inputbox">
            <label class="sr-only" for="input">Ask a factual question about HDFC Mutual Fund schemes</label>
            <textarea id="input" rows="1" maxlength="500" placeholder="Ask a factual question…" enterkeyhint="send"
                      role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false"></textarea>
            <span class="count" id="count" aria-live="off">0 / 500</span>
            <button class="send" id="send" type="submit" aria-label="Send" disabled></button>
          </div>
          <p class="hint"><span data-icon="lock"></span><span id="privacyHint">Don't share PAN, Aadhaar, phone or OTP.</span></p>
        </div>
      </form>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="alert" hidden>
  <span data-icon="alert" class="lead-wrap"></span>
  <span id="toastText"></span>
  <button class="icon-btn" id="toastClose" type="button" aria-label="Dismiss"></button>
</div>

<script>
"use strict";
(function () {
  // -------------------------------------------------------------------------
  // Icons: static, trusted SVG drawn with createElementNS (no markup strings).
  // -------------------------------------------------------------------------
  const P = {
    plus: ["M12 5v14", "M5 12h14"],
    menu: ["M4 7h16", "M4 12h16", "M4 17h16"],
    close: ["M6 6l12 12", "M18 6L6 18"],
    sun: ["M12 3v2", "M12 19v2", "M3 12h2", "M19 12h2", "M5.6 5.6l1.4 1.4", "M17 17l1.4 1.4", "M5.6 18.4L7 17", "M17 7l1.4-1.4", {c: [12, 12, 4]}],
    moon: ["M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"],
    shield: ["M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z", "M8.8 12.2l2.2 2.2 4.3-4.6"],
    chat: ["M20.5 11.5a8 8 0 0 1-11.7 7.1L4 20l1.4-4.4A8 8 0 1 1 20.5 11.5z"],
    sparkchat: ["M20.5 11.5a8 8 0 0 1-11.7 7.1L4 20l1.4-4.4A8 8 0 1 1 20.5 11.5z", "M12.5 7.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"],
    trash: ["M4.5 7h15", "M9.5 7V4.5h5V7", "M6.5 7l1 13h9l1-13", "M10 11v5.5", "M14 11v5.5"],
    send: ["M21 3L10.5 13.5", "M21 3l-6.5 18-4-7.5L3 9.5z"],
    percent: ["M19 5L5 19", {c: [7, 7, 2.5]}, {c: [17, 17, 2.5]}],
    hourglass: ["M7 3h10", "M7 21h10", "M8 3v3.5c0 2 4 3.5 4 5.5s-4 3.5-4 5.5V21", "M16 3v3.5c0 2-4 3.5-4 5.5s4 3.5 4 5.5V21"],
    download: ["M12 4v11", "M7 10.5l5 5 5-5", "M5 20h14"],
    check: [{c: [12, 12, 9]}, "M8 12.4l2.7 2.7L16.2 9.6"],
    hand: ["M8 12.5V6.5a1.5 1.5 0 0 1 3 0V11", "M11 11V4.5a1.5 1.5 0 0 1 3 0V11", "M14 11V6a1.5 1.5 0 0 1 3 0v7.5c0 4-2.7 7-6.3 7-2.8 0-4.6-1.5-6-4L3.4 14a1.5 1.5 0 0 1 2.6-1.5l2 3"],
    nochart: ["M4 20h16", "M5 15.5l4-4 3 3 6.5-6.5", "M3.5 3.5l17 17"],
    lock: [{r: [5, 10.5, 14, 10, 2.5]}, "M8 10.5V7.5a4 4 0 0 1 8 0v3", "M12 14.5v2.5"],
    question: [{c: [12, 12, 9]}, "M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6", "M12 16.8v.2"],
    searchx: [{c: [10.5, 10.5, 6.5]}, "M20 20l-4.6-4.6", "M8.3 8.3l4.4 4.4", "M12.7 8.3l-4.4 4.4"],
    external: ["M14 4h6v6", "M20 4l-8.5 8.5", "M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"],
    clock: [{c: [12, 12, 8.5]}, "M12 7.5V12l3 2"],
    arrow: ["M5 12h14", "M13 6l6 6-6 6"],
    arrowUR: ["M7 17L17 7", "M9 7h8v8"],
    alert: ["M12 4l9 16H3z", "M12 10v4", "M12 17v.2"],
    empty: ["M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H9l-5 3z", "M8.5 9.5h7", "M8.5 12.5h4"],
  };
  const NS = "http://www.w3.org/2000/svg";
  function icon(name) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("class", "i"); svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.8"); svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    for (const part of P[name] || []) {
      let el;
      if (typeof part === "string") { el = document.createElementNS(NS, "path"); el.setAttribute("d", part); }
      else if (part.c) { el = document.createElementNS(NS, "circle"); [["cx", 0], ["cy", 1], ["r", 2]].forEach(([k, i]) => el.setAttribute(k, part.c[i])); }
      else if (part.r) { el = document.createElementNS(NS, "rect"); [["x", 0], ["y", 1], ["width", 2], ["height", 3], ["rx", 4]].forEach(([k, i]) => el.setAttribute(k, part.r[i])); }
      svg.appendChild(el);
    }
    return svg;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  document.querySelectorAll("[data-icon]").forEach(s => s.replaceWith(icon(s.dataset.icon)));

  // -------------------------------------------------------------------------
  // State
  // -------------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const ui = {
    messages: $("messages"), scroll: $("scroll"), threads: $("threads"), input: $("input"), send: $("send"),
    count: $("count"), composer: $("composer"), sidebar: $("sidebar"), scrim: $("scrim"), menuBtn: $("menuBtn"),
    themeBtn: $("themeBtn"), toast: $("toast"), toastText: $("toastText"),
  };
  ui.menuBtn.appendChild(icon("menu"));
  ui.send.appendChild(icon("send"));
  $("toastClose").appendChild(icon("close"));
  document.querySelector(".toast .lead-wrap, .toast svg").classList?.add("lead");

  // lastScheme: scheme of the thread's latest answer (for next-step chips);
  // misses: "not found" replies in a row in this thread (fallback layer 2 after two).
  const state = { config: null, threads: [], active: null, pending: new Set(), confirming: null,
                  lastScheme: null, misses: 0 };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  };

  // -------------------------------------------------------------------------
  // API
  // -------------------------------------------------------------------------
  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(path, opts); }
    catch (e) { throw { status: 0, message: "Can't reach BoloSIP. Is the server running?" }; }
    if (res.status === 204) return null;
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok) {
      const retry = res.headers.get("Retry-After");
      throw { status: res.status, message: (data && data.error) || "Something went wrong.", retry };
    }
    return data;
  }

  // -------------------------------------------------------------------------
  // Theme
  // -------------------------------------------------------------------------
  function paintThemeButton() {
    const dark = document.documentElement.dataset.theme !== "light";
    ui.themeBtn.replaceChildren(icon(dark ? "sun" : "moon"));
    ui.themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  }
  ui.themeBtn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    store.set("bolosip.theme", next);
    paintThemeButton();
  });
  paintThemeButton();

  // -------------------------------------------------------------------------
  // Drawer (narrow screens)
  // -------------------------------------------------------------------------
  function setDrawer(open) {
    ui.sidebar.classList.toggle("open", open);
    ui.scrim.classList.toggle("open", open);
    ui.menuBtn.setAttribute("aria-expanded", String(open));
    if (open) { const first = ui.sidebar.querySelector("button"); first && first.focus({ preventScroll: true }); }
  }
  ui.menuBtn.addEventListener("click", () => setDrawer(!ui.sidebar.classList.contains("open")));
  ui.scrim.addEventListener("click", () => setDrawer(false));
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (state.confirming) { state.confirming = null; renderThreads(); return; }
    if (ui.sidebar.classList.contains("open")) { setDrawer(false); ui.menuBtn.focus(); }
  });
  const narrow = window.matchMedia("(max-width: 700px)");

  // -------------------------------------------------------------------------
  // Toast
  // -------------------------------------------------------------------------
  let toastTimer = null;
  function toast(msg, ms) {
    ui.toastText.textContent = msg;
    ui.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { ui.toast.hidden = true; }, ms || 6000);
  }
  $("toastClose").addEventListener("click", () => { ui.toast.hidden = true; });
  function showError(err) {
    if (err && err.status === 429) toast(`Too many messages. Please wait ${err.retry || "a few"} seconds.`);
    else toast((err && err.message) || "Something went wrong.");
  }

  // -------------------------------------------------------------------------
  // Threads
  // -------------------------------------------------------------------------
  function ago(iso) {
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (!isFinite(s)) return "";
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    if (s < 172800) return "yesterday";
    return `${Math.floor(s / 86400)} days ago`;
  }

  async function loadThreads() {
    try { state.threads = await api("GET", "/api/threads"); }
    catch (e) { state.threads = []; showError(e); }
    renderThreads();
  }

  function renderThreads() {
    const ul = ui.threads;
    ul.replaceChildren();
    if (!state.threads.length) {
      const li = el("li", "empty-threads");
      li.append(icon("empty"), el("div", null, "No chats yet. Ask your first question."));
      ul.appendChild(li);
      return;
    }
    for (const t of state.threads) {
      const li = el("li", "thread");
      if (t.id === state.active) li.setAttribute("aria-current", "true");
      const b = el("button", "thread-btn");
      b.type = "button";
      const ico = el("span", "thread-ico"); ico.appendChild(icon("chat"));
      const txt = el("span", "thread-text");
      txt.append(el("span", "thread-title", t.title), el("span", "thread-time", ago(t.updated_at)));
      b.append(ico, txt);
      b.addEventListener("click", () => { openThread(t.id); if (narrow.matches) setDrawer(false); });
      const del = el("button", "thread-del");
      del.type = "button"; del.setAttribute("aria-label", `Delete chat: ${t.title}`); del.appendChild(icon("trash"));
      del.addEventListener("click", () => { state.confirming = t.id; renderThreads(); });
      const row = el("div", "thread-row");
      row.append(b, del);
      li.appendChild(row);
      if (state.confirming === t.id) li.appendChild(confirmBox(t));
      ul.appendChild(li);
    }
  }

  function confirmBox(t) {
    const box = el("div", "confirm");
    box.setAttribute("role", "alertdialog"); box.setAttribute("aria-label", "Delete this chat?");
    const p = el("p"); p.append(el("strong", null, "Delete this chat?"), el("br"), el("small", null, "Its messages are removed for good."));
    const actions = el("div", "confirm-actions");
    const cancel = el("button", "btn", "Cancel"); cancel.type = "button";
    const ok = el("button", "btn btn-danger", "Delete"); ok.type = "button";
    cancel.addEventListener("click", () => { state.confirming = null; renderThreads(); });
    ok.addEventListener("click", async () => {
      ok.disabled = true;
      try { await api("DELETE", `/api/threads/${t.id}`); }
      catch (e) { if (e.status !== 404) { showError(e); ok.disabled = false; return; } }
      state.confirming = null;
      if (state.active === t.id) startNew();
      await loadThreads();
    });
    actions.append(cancel, ok);
    box.append(p, actions);
    setTimeout(() => cancel.focus({ preventScroll: true }), 0);
    return box;
  }

  function setActive(id) {
    state.active = id;
    store.set("bolosip.thread", id);
    renderThreads();
    updateSend();
  }

  function startNew() {
    setActive(null);
    state.lastScheme = null; state.misses = 0;
    renderWelcome();
    ui.input.focus();
  }

  async function openThread(id) {
    let msgs;
    try { msgs = await api("GET", `/api/threads/${id}/messages`); }
    catch (e) {
      if (e.status === 404 || e.status === 400) {           // THR-12: thread gone
        store.set("bolosip.thread", null);
        startNew(); loadThreads();
        return;
      }
      showError(e); return;
    }
    setActive(id);
    ui.messages.replaceChildren();
    if (!msgs.length) { renderWelcome(); return; }
    let lastQuestion = "", lastReply = null;
    state.lastScheme = null; state.misses = 0;
    for (const m of msgs) {
      if (m.role === "user") { lastQuestion = m.text; addUser(m.text); }
      else { addReply(m, lastQuestion); trackReply(m); lastReply = m; }
    }
    if (lastReply) addNextSteps(lastReply, lastQuestion);
    scrollDown(false);
  }

  // -------------------------------------------------------------------------
  // Rendering
  // -------------------------------------------------------------------------
  const KIND = {
    answer:      { icon: "check",     label: "Answer" },
    refusal:     { icon: "hand",      label: "Facts only, no advice" },
    performance: { icon: "nochart",   label: "No returns figures" },
    privacy:     { icon: "lock",      label: "Personal details" },
    clarify:     { icon: "question",  label: "Which scheme?" },
    not_found:   { icon: "searchx",   label: "Not in my sources" },
    help:        { icon: "sparkchat", label: "How I can help" },
  };
  const EXAMPLE_LOOK = [
    { icon: "percent",   tone: "t-green", tag: "Expense ratio" },
    { icon: "hourglass", tone: "t-amber", tag: "ELSS lock-in" },
    { icon: "download",  tone: "t-blue",  tag: "Statements" },
  ];

  // Topic shortcuts on the welcome screen: they start a question and the typing
  // suggestions finish it with a scheme name.
  const TOPIC_STARTS = [
    ["Expense ratio", "expense ratio of "], ["Exit load", "exit load of "], ["Minimum SIP", "minimum SIP for "],
    ["Riskometer", "riskometer of "], ["Benchmark", "benchmark of "], ["NAV", "NAV of "],
    ["Fund size", "fund size of "], ["Fund managers", "fund manager of "], ["Statements", "how to download my statement"],
  ];
  const TRUST = [["check", "Every answer links to its source"], ["hand", "Facts only, never advice"],
                 ["lock", "Personal details are never stored"]];

  function renderWelcome() {
    ui.messages.replaceChildren();
    const cfg = state.config || {};
    const w = el("div", "welcome");
    const built = state.health && state.health.corpus_built_on;
    const eyebrow = el("div", "eyebrow");
    eyebrow.append(el("span", "dot"),
                   el("span", null, built ? `27 HDFC schemes · data updated ${built}` : "27 HDFC Mutual Fund schemes"));
    const h1 = el("h1");
    h1.append(document.createTextNode("Mutual fund facts."), el("em", null, "Straight from the source."));
    w.append(eyebrow, h1,
             el("p", null, cfg.welcome || "I answer factual questions about 27 HDFC Mutual Fund schemes. Every answer links to its source."));
    const topics = el("div", "topics");
    topics.setAttribute("aria-label", "Start a question about");
    for (const [label, start] of TOPIC_STARTS) {
      const t = el("button", "topic", label);
      t.type = "button";
      t.addEventListener("click", () => {
        ui.input.value = start;
        ui.input.focus();
        ui.input.setSelectionRange(start.length, start.length);
        ui.input.dispatchEvent(new Event("input", { bubbles: true }));
      });
      topics.appendChild(t);
    }
    w.append(topics, el("div", "examples-label", "Or try one of these"));
    const grid = el("div", "examples");
    (cfg.examples || []).forEach((q, i) => {
      const look = EXAMPLE_LOOK[i % EXAMPLE_LOOK.length];
      const card = el("button", "example");
      card.type = "button";
      const top = el("div", "example-top");
      const tile = el("span", `tile ${look.tone}`); tile.appendChild(icon(look.icon));
      const arrow = el("span", "example-arrow"); arrow.appendChild(icon("arrowUR"));
      top.append(tile, arrow);
      const words = el("div");
      const tag = el("div", `example-tag ${look.tone}`, look.tag); tag.style.background = "none";
      words.append(tag, el("div", "example-q", q));
      card.append(top, words);
      card.addEventListener("click", () => send(q));
      grid.appendChild(card);
    });
    w.appendChild(grid);
    const trust = el("ul", "trust");
    for (const [ic, text] of TRUST) { const li = el("li"); li.append(icon(ic), el("span", null, text)); trust.appendChild(li); }
    w.appendChild(trust);
    ui.messages.appendChild(w);
  }

  function addUser(text) {
    const b = el("div", "msg-user", text);
    ui.messages.appendChild(b);
    return b;
  }

  // Values in answers ("0.73% per annum", "₹1,00,687.07 crore", "\"Very High\"") are
  // highlighted by splitting the text into spans: still textContent only.
  const VALUE = /(₹\s?[\d,]+(?:\.\d+)?(?:\s?(?:crore|lakh))?|\d+(?:\.\d+)?\s?%(?:\s?per annum)?|"[^"]{2,40}")/g;
  function textWithValues(container, text) {
    let last = 0;
    for (const m of text.matchAll(VALUE)) {
      if (m.index > last) container.appendChild(document.createTextNode(text.slice(last, m.index)));
      container.appendChild(el("span", "value", m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) container.appendChild(document.createTextNode(text.slice(last)));
  }

  // Topic words carried into a clarify choice ("HDFC Flexi Cap Fund expense ratio").
  const TOPIC = /\b(expense ratio|ter|exit load|minimum sip|min sip|minimum investment|lump ?sum|riskometer|risk level|benchmark|fund managers?|who manages|nav|aum|fund size|lock[- ]?in|launch date|isin|stamp duty|category|objective)\b/i;

  function addReply(r, question) {
    const k = KIND[r.kind] || KIND.not_found;
    const card = el("article", "reply");
    card.dataset.kind = r.kind;
    const head = el("div", "reply-head");
    const ico = el("div", "reply-ico"); ico.appendChild(icon(k.icon));
    head.append(ico, el("span", "kind-label", k.label));
    const body = el("div", "reply-body");
    body.appendChild(el("span", "kind-label", k.label));
    const p = el("p", "reply-text");
    textWithValues(p, r.text);
    body.appendChild(p);

    if (r.candidates && r.candidates.length) {
      const box = el("div", "choices");
      const topic = (question.match(TOPIC) || [""])[0];
      for (const c of r.candidates) {
        const b = el("button", "choice");
        b.type = "button";
        b.append(el("span", null, c), icon("arrow"));
        b.addEventListener("click", () => send(r.kind === "help" ? c : (topic ? `${c} ${topic}` : c)));
        box.appendChild(b);
      }
      body.appendChild(box);
    }
    const meta = el("div", "reply-meta");
    if (r.source && r.source.url && /^https:\/\//.test(r.source.url)) {
      const a = el("a", "source");
      a.href = r.source.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      let domain = "";
      try { domain = new URL(r.source.url).hostname.replace(/^www\./, ""); } catch (e) { /* keep empty */ }
      a.append(icon("external"), el("span", null, r.source.name || r.source.url));
      if (domain) a.appendChild(el("span", "domain", domain));
      a.setAttribute("aria-label", `Source: ${r.source.name || r.source.url} (opens in a new tab)`);
      meta.appendChild(a);
    }
    if (r.footer) {
      const f = el("div", "footer");
      f.append(icon("clock"), el("span", null, r.footer));
      meta.appendChild(f);
    }
    if (meta.childNodes.length) body.appendChild(meta);
    card.append(head, body);
    ui.messages.appendChild(card);
    return card;
  }

  function scrollDown(smooth = true) {
    ui.scroll.scrollTo({ top: ui.scroll.scrollHeight, behavior: smooth ? "smooth" : "auto" });
  }

  // -------------------------------------------------------------------------
  // Question suggestions. The index comes once from /api/config (bolosip/suggest.py);
  // every question it can build is tested to get a correct, cited answer.
  // -------------------------------------------------------------------------
  const STOP = new Set(("a an the of for to in on is are was be it its this that what which who how do does did i my me " +
                        "can could would should will there any by with at from as and or about tell please hdfc fund funds " +
                        "scheme mutual mf direct growth plan").split(" "));
  const norm = s => (s || "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();
  let CANDS = null;

  function buildCandidates() {
    const ix = state.config && state.config.suggest;
    if (!ix) return [];
    const out = [];
    ix.general.forEach((q, gi) => out.push({ text: q, scheme: [], topic: norm(q).split(" "), words: [], rank: gi }));
    ix.topics.forEach((t, ti) => ix.schemes.forEach((s, si) => {
      const text = t.template.replace("{name}", s.name);
      // words: the template's own words only ("who manages"), not the scheme name
      out.push({ text, scheme: s.keys.split(" "), topic: t.keys.split(" "),
                 words: norm(t.template.replace("{name}", "")).split(" "), rank: 1000 + ti * 100 + si });
    }));
    return out;
  }

  // Every typed word must start a word of the scheme name / aliases, the topic and its
  // synonyms, or the question itself; the last word may be half typed.
  function suggestionsFor(input, limit = 6) {
    if (!CANDS) CANDS = buildCandidates();
    const toks = norm(input).split(" ").filter(t => t && !STOP.has(t));
    if (!toks.length || norm(input).length < 2) return [];
    const last = toks.length - 1, found = [];
    for (const c of CANDS) {
      let score = 0;
      for (let i = 0; i < toks.length && score >= 0; i++) {
        const t = toks[i];
        const hit = w => (i === last ? w.startsWith(t) : (w === t || (t.length >= 3 && w.startsWith(t))));
        // Whole-word matches outrank prefixes ("ter" is the expense ratio, not "Term"),
        // and a scheme-name match outranks a topic match ("small cap" is the Small Cap
        // scheme, not "smallest amount" for Large Cap).
        if (c.scheme.includes(t) || c.topic.includes(t)) score += 5;
        else if (c.scheme.some(hit)) score += 4;
        else if (c.topic.some(hit)) score += 3;
        else if (c.words.some(hit)) score += 1;
        else { score = -1; break; }
        if (c.words.some(hit)) score += 1;               // also in the visible question ("who man…")
      }
      if (score > 0) found.push({ c, score });
    }
    found.sort((a, b) => b.score - a.score || a.c.rank - b.c.rank);
    const typed = norm(input), seen = new Set();
    return found.map(f => f.c.text)
                .filter(text => norm(text) !== typed && !seen.has(text) && seen.add(text))
                .slice(0, limit);
  }

  // Bold the parts of a suggestion that match what was typed (text nodes only).
  function markMatches(li, text, input) {
    const toks = norm(input).split(" ").filter(t => t.length >= 2 && !STOP.has(t));
    const re = toks.length ? new RegExp("\\b(" + toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi") : null;
    let lastIdx = 0;
    if (re) for (const m of text.matchAll(re)) {
      if (m.index > lastIdx) li.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
      li.appendChild(el("mark", null, m[0]));
      lastIdx = m.index + m[0].length;
    }
    li.appendChild(document.createTextNode(text.slice(lastIdx)));
  }

  const sug = { list: $("suggestions"), items: [], active: -1 };
  function closeSuggest() {
    sug.items = []; sug.active = -1;
    sug.list.hidden = true; sug.list.replaceChildren();
    ui.input.setAttribute("aria-expanded", "false");
    ui.input.removeAttribute("aria-activedescendant");
  }
  // fromTyping: called by an input event, so the user is in the box whatever
  // document.activeElement says at that instant (ISS-043).
  function renderSuggest(fromTyping = false) {
    const value = ui.input.value;
    sug.items = value.includes("\n") ? [] : suggestionsFor(value);
    sug.active = -1;
    if (!sug.items.length || (!fromTyping && document.activeElement !== ui.input)) { closeSuggest(); return; }
    sug.list.replaceChildren(el("li", "suggest-head", "Suggested questions"));
    sug.list.firstChild.setAttribute("role", "presentation");
    sug.items.forEach((text, i) => {
      const li = el("li");
      li.id = `sug-${i}`; li.setAttribute("role", "option"); li.setAttribute("aria-selected", "false");
      li.appendChild(icon("sparkchat"));
      const span = el("span"); markMatches(span, text, value); li.appendChild(span);
      li.addEventListener("mousedown", e => { e.preventDefault(); pickSuggestion(i, true); });
      sug.list.appendChild(li);
    });
    sug.list.hidden = false;
    ui.input.setAttribute("aria-expanded", "true");
  }
  function moveSuggestion(delta) {
    if (!sug.items.length) return;
    const n = sug.items.length + 1;                     // positions: none, item 0 … item n-2
    sug.active = (sug.active + 1 + delta + n) % n - 1;  // -1 = nothing highlighted
    sug.list.querySelectorAll('[role="option"]').forEach((li, i) => li.setAttribute("aria-selected", String(i === sug.active)));
    if (sug.active >= 0) {
      ui.input.setAttribute("aria-activedescendant", `sug-${sug.active}`);
      $(`sug-${sug.active}`).scrollIntoView({ block: "nearest" });
    } else ui.input.removeAttribute("aria-activedescendant");
  }
  function pickSuggestion(i, sendNow) {
    const text = sug.items[i];
    closeSuggest();
    if (sendNow) { send(text); return; }
    ui.input.value = text; autosize(); updateSend();
  }

  // -------------------------------------------------------------------------
  // Next steps after a reply (chatbot-flow-design: branch with value; layered
  // fallback with suggested intents; never a dead end).
  // -------------------------------------------------------------------------
  function schemeName(id) {
    const s = state.config && state.config.suggest && state.config.suggest.schemes.find(x => x.id === id);
    return s ? s.name : null;
  }
  function trackReply(r) {
    if (r.kind === "answer" && r.scheme_id) state.lastScheme = r.scheme_id;
    state.misses = r.kind === "not_found" ? state.misses + 1 : (r.kind === "answer" ? 0 : state.misses);
  }
  function topicAsked(t, question) {
    const q = ` ${norm(question)} `;
    return [t.label, ...t.keys.split(" ").filter(k => k.length >= 4)].some(k => q.includes(` ${norm(k)} `));
  }
  function schemeChips(schemeId, question, n) {
    const ix = state.config.suggest, name = schemeName(schemeId);
    if (!name) return [];
    const order = ix.topics.slice(0, ix.core).concat(ix.topics.filter(t => t.id === "fund_manager" || t.id === "nav"));
    return order.filter(t => !topicAsked(t, question)).slice(0, n)
                .map(t => ({ label: t.label, text: t.template.replace("{name}", name) }));
  }
  function addNextSteps(r, question) {
    const ix = state.config && state.config.suggest;
    if (!ix) return;
    let label = null, chips = [];
    if (r.kind === "answer" && r.scheme_id) {
      // Skip topics already asked anywhere in this thread, not just the last question.
      const asked = [...ui.messages.querySelectorAll(".msg-user")].map(u => u.textContent).join(" | ");
      label = "Ask next:"; chips = schemeChips(r.scheme_id, `${asked} | ${question}`, 3);
    } else if (["not_found", "refusal", "performance"].includes(r.kind)) {
      label = "Try instead:";
      const sid = r.scheme_id || state.lastScheme;
      // Name the scheme on the chip: after a refusal the context isn't obvious.
      chips = sid ? schemeChips(sid, "", 3).map(c => ({ ...c, label: `${c.label} of ${schemeName(sid)}` }))
                  : ix.general.slice(0, 3).map(q => ({ label: q, text: q }));
    }
    if (chips.length) {
      const row = el("div", "nextsteps");
      row.appendChild(el("span", "nextsteps-label", label));
      for (const c of chips) {
        const b = el("button", "chip");
        b.type = "button"; b.title = c.text;
        b.setAttribute("aria-label", `Ask: ${c.text}`);
        b.append(icon("arrow"), el("span", null, c.label));
        b.addEventListener("click", () => send(c.text));
        row.appendChild(b);
      }
      ui.messages.appendChild(row);
    }
    if (r.kind === "not_found" && state.misses >= 2) {                    // repeated fallback
      ui.messages.appendChild(el("p", "capability-note",
        "I answer facts about 27 HDFC Mutual Fund schemes (expense ratio, exit load, minimum SIP, riskometer, " +
        "benchmark, fund managers, NAV, fund size, lock-in, launch date) and how to get statements, capital gains " +
        "reports and the ELSS rule. Start typing a scheme name to see questions I can answer."));
    }
  }

  // -------------------------------------------------------------------------
  // Sending
  // -------------------------------------------------------------------------
  function updateSend() {
    const text = ui.input.value.trim();
    const busy = state.active != null && state.pending.has(state.active);
    ui.send.disabled = !text || busy || state.creating === true;
    const n = ui.input.value.length;
    ui.count.textContent = `${n} / 500`;
    ui.count.classList.toggle("near", n >= 450);
  }

  async function send(text) {
    text = (text || "").trim();
    if (!text) return;
    if (text.length > 500) { toast("Message too long (max 500 characters)."); return; }
    if (state.active && state.pending.has(state.active)) return;

    let tid = state.active;
    if (!tid) {                                              // create the thread on the first message
      state.creating = true; updateSend();
      try { tid = (await api("POST", "/api/threads", {})).id; }
      catch (e) { state.creating = false; updateSend(); showError(e); return; }
      state.creating = false;
      setActive(tid);
      ui.messages.replaceChildren();
    }
    ui.input.value = ""; autosize(); updateSend(); closeSuggest();
    ui.messages.querySelectorAll(".nextsteps, .capability-note").forEach(n => n.remove());
    const bubble = addUser(text);
    const typing = el("div", "typing");
    typing.setAttribute("aria-label", "BoloSIP is looking this up");
    typing.append(el("i"), el("i"), el("i"), el("span", null, "Checking the sources…"));
    ui.messages.appendChild(typing);
    scrollDown();

    state.pending.add(tid); updateSend();
    let reply = null;
    try { reply = await api("POST", `/api/threads/${tid}/messages`, { text }); }
    catch (e) {
      typing.remove();
      if (e.status === 404) { bubble.remove(); toast("That chat was deleted. Starting a new one."); startNew(); loadThreads(); }
      else { bubble.remove(); ui.input.value = text; autosize(); showError(e); }
    }
    finally { state.pending.delete(tid); updateSend(); }
    if (!reply) return;
    typing.remove();
    if (state.active !== tid) { loadThreads(); return; }    // user switched chats meanwhile
    if (reply.kind === "privacy") {
      // Show what was actually saved: personal details replaced with [redacted].
      await openThread(tid);
    } else {
      addReply(reply, text);
      trackReply(reply);
      addNextSteps(reply, text);
    }
    scrollDown();
    loadThreads();
  }

  function autosize() {
    ui.input.style.height = "auto";
    ui.input.style.height = Math.min(ui.input.scrollHeight, 160) + "px";
  }
  // The list closes shortly after the box loses focus (so a click on an option still lands),
  // but a pending close is cancelled as soon as the user is back in the box (ISS-043).
  let blurTimer = null;
  ui.input.addEventListener("input", () => { clearTimeout(blurTimer); autosize(); updateSend(); renderSuggest(true); });
  ui.input.addEventListener("focus", () => { clearTimeout(blurTimer); renderSuggest(); });
  ui.input.addEventListener("blur", () => { clearTimeout(blurTimer); blurTimer = setTimeout(closeSuggest, 120); });
  ui.input.addEventListener("keydown", e => {
    const open = !sug.list.hidden && sug.items.length;
    if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); moveSuggestion(e.key === "ArrowDown" ? 1 : -1); return; }
    if (open && e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeSuggest(); return; }
    if (open && e.key === "Tab" && sug.active >= 0 && !e.shiftKey) { e.preventDefault(); pickSuggestion(sug.active, false); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (open && sug.active >= 0) { pickSuggestion(sug.active, true); return; }
      if (!ui.send.disabled) send(ui.input.value);
    }
  });
  ui.composer.addEventListener("submit", e => { e.preventDefault(); if (!ui.send.disabled) send(ui.input.value); });
  $("newChat").addEventListener("click", () => { startNew(); if (narrow.matches) setDrawer(false); });

  // -------------------------------------------------------------------------
  // Start
  // -------------------------------------------------------------------------
  (async function init() {
    try {
      const [cfg, health] = await Promise.all([api("GET", "/api/config"), api("GET", "/api/health").catch(() => null)]);
      state.config = cfg; state.health = health;
      if (state.config.privacy_hint) $("privacyHint").textContent = state.config.privacy_hint;
    } catch (e) { showError(e); }
    await loadThreads();
    const saved = store.get("bolosip.thread");
    if (saved && state.threads.some(t => t.id === saved)) await openThread(saved);
    else { store.set("bolosip.thread", null); startNew(); }
    updateSend();
  })();
})();
</script>
</body>
</html>
